planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      # Map management parameters
      always_send_full_costmap: true
      rolling_window: false
      track_unknown_space: true
      trinary_costmap: true
      unknown_cost_value: 255
      use_maximum: false
      # Map dimensions
      width: 5
      height: 5
      resolution: 0.02
      # Coordinate frame and tf parameters
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      # Footprint parameters
      footprint_padding: 0.01
      robot_radius: 0.25
      lethal_cost_threshold: 100
      # Rate parameters
      update_frequency: 1.0
      publish_frequency: 1.0
      # Plugins and filters
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        mapping_mode: false
        map_save_duration: 60.0
        # Global Filtering Parameters
        transform_tolerance: 0.5
        # Obstacle Parameters
        track_unknown_space: true
        update_footprint_enabled: true
        combination_method: 1
        # Voxel Parameters
        origin_z: 0.0
        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.05
        unknown_threshold: 15
        mark_threshold: 0
        publish_voxel_map: true
        observation_sources: rgbd1_mark rgbd1_clear
        rgbd1_mark:
          data_type: PointCloud2
          topic: /realsense/depth/color/points
          marking: true
          clearing: false
          obstacle_range: 3.0 # meters
          min_obstacle_height: 0.0 # default 0, meters
          max_obstacle_height: 2.0 # default 3, meters
          expected_update_rate: 0.0 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false # default false, for laser scans
          filter: "voxel" # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
          voxel_min_points: 0 # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true # default false, clear the buffer after the layer gets readings from it
        rgbd1_clear:
          data_type: PointCloud2
          topic: /realsense/depth/color/points
          marking: false
          clearing: true
          max_z: 7.0 # default 0, meters
          min_z: 0.3 # default 10, meters
          vertical_fov_angle: 0.7 # default 0.7, radians
          horizontal_fov_angle: 1.04 # default 1.04, radians
          decay_acceleration: 5.0 # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 0 # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan/filtered
          data_type: "LaserScan"
          observation_persistence: 0.0
          expected_update_rate: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 3.0
        inflate_unknown: false
        inflate_around_unknown: false
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        filter_info_topic: "/costmap_filter_info"
